<body>

      <div class="devs-container">
        <!-- Card 1 -->
        <div class="dev-card">
          <div class="dev-photo-container">

          </div>
          <h3>Luis Felipe Veronezi</h3>
          <div class="dev-links">
            <a href="https://www.linkedin.com/in/luis-felipe-veronezi-57a942304/" target="_blank"
              class="dev-link linkedin">LinkedIn</a>
            <span class="dev-email">luisfelipevbernardo@gmail.com</span>
          </div>
        </div>
        <!-- Card 2 -->
        <div class="dev-card">
          <div class="dev-photo-container">
            <img src="https://avatars.githubusercontent.com/u/181371049?v=4" alt="Leonardo Antoniassi"
              class="dev-photo">
          </div>
          <h3>Leonardo Antoniassi</h3>
          <div class="dev-links">
            <a href="https://www.linkedin.com/in/leonardo-antoniassi-46084a322/" target="_blank"
              class="dev-link linkedin">LinkedIn</a>
            <span class="dev-email">leoantoniassi9@gmail.com</span>
          </div>
        </div>
      </div>
    </div>

  <script type="module" src="/src/main.ts"></script>
